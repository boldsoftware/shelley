<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelley Bookmarklet</title>
    <link rel="stylesheet" href="standalone.css" />
  </head>
  <body>
    <main>
      <h1>Shelley Bookmarklet</h1>
      <p>
        Click it on any page to start a Shelley chat about that page, pick elements into it, and
        record your screen or voice with what you point at.
      </p>
      <label>
        Your Shelley URL
        <input id="origin" type="url" placeholder="https://your-vm.exe.xyz:9999" />
      </label>
      <p><a id="link" draggable="true">Shelley</a> ← drag to your bookmarks bar</p>
    </main>
    <script src="standalone.js"></script>
  </body>
</html>
