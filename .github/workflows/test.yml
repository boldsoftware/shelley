name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js and pnpm
        run: |
          dirs="$(scripts/with-node)"
          echo "${dirs//:/$'\n'}" >> "$GITHUB_PATH"

      - name: Install tmux
        run: sudo apt-get install -y tmux

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Install UI dependencies
        run: |
          cd ui
          pnpm install --frozen-lockfile

      - name: Run unit tests
        run: |
          cd ui
          pnpm test

      - name: Build UI
        run: |
          cd ui
          pnpm run build

      - name: Upload bookmarklet
        uses: actions/upload-artifact@v4
        with:
          name: shelley-bookmarklet
          path: ui/dist/shelley-bookmarklet.html
          if-no-files-found: error

      - name: Build templates
        run: |
          for dir in templates/*/; do
            name=$(basename "$dir")
            echo "Creating $name.tar.gz..."
            tar -czf "templates/$name.tar.gz" -C "templates/$name" --exclude='.DS_Store' .
          done

      - name: Fetch embedded exe-scroll
        run: make exe-scroll-all

      - name: Build all release targets
        run: |
          for GOOS in linux darwin; do
            for GOARCH in amd64 arm64; do
              GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -o "bin/shelley-$GOOS-$GOARCH" ./cmd/shelley
            done
          done

      - name: Run Go tests
        run: go test -v ./...

      - name: Build shelley binary
        run: go build -o bin/shelley ./cmd/shelley

      - name: Install Playwright browsers
        if: false
        run: |
          cd ui
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        if: false
        run: |
          cd ui
          npx playwright test

      - name: Upload Playwright report
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ui/test-results/
          retention-days: 7
          if-no-files-found: ignore
